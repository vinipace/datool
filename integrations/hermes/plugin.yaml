name: datool
version: "0.1.0"
description: "Automatically trace Hermes conversations, model requests and tools in Datool."
author: Datool
requires_hermes: ">=0.21.3"
hooks:
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - on_session_end
  - on_session_finalize
