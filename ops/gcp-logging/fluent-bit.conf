[SERVICE]
    Flush                     5
    Grace                     30
    Log_Level                 warn
    Parsers_File              /etc/datool-logging/parsers.conf
    storage.path              /var/lib/datool-logging/buffer
    storage.sync              normal
    storage.checksum          on
    storage.max_chunks_up     32
    storage.backlog.mem_limit  16M

[INPUT]
    Name              systemd
    Tag               datool.host
    DB                /var/lib/datool-logging/journal.db
    Read_From_Tail    On
    Max_Entries       500
    Systemd_Filter    _SYSTEMD_UNIT=docker.service
    Systemd_Filter    _SYSTEMD_UNIT=nginx.service
    Systemd_Filter    _SYSTEMD_UNIT=ssh.service
    Systemd_Filter    _SYSTEMD_UNIT=fail2ban.service
    Systemd_Filter    _SYSTEMD_UNIT=logrotate.service
    Systemd_Filter    _SYSTEMD_UNIT=datool-host-health.service
    Systemd_Filter    _SYSTEMD_UNIT=datool-disk-maintenance.service
    Systemd_Filter    _SYSTEMD_UNIT=datool-logging.service
    Systemd_Filter    _SYSTEMD_UNIT=datool-log-discovery.service
    Systemd_Filter    _TRANSPORT=kernel
    Systemd_Filter    SYSLOG_IDENTIFIER=datool-logging-canary
    Systemd_Filter_Type Or
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               datool.container
    Path              /var/log/datool-logging/containers/*.log
    Path_Key          source_file
    Parser            docker
    DB                /var/lib/datool-logging/containers.db
    DB.Compare_Filename On
    Read_From_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Buffer_Max_Size   256k
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               datool.nginx
    Path              /var/log/nginx/datool-access.log,/var/log/nginx/datool-error.log
    Path_Key          source_file
    DB                /var/lib/datool-logging/nginx.db
    Read_From_Head    Off
    Refresh_Interval  5
    Rotate_Wait       30
    Buffer_Max_Size   256k
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name              lua
    Match             datool.*
    Script            /etc/datool-logging/normalize.lua
    Call              normalize
    Time_As_Table     On

[OUTPUT]
    Name                       stackdriver
    Match                      datool.*
    google_service_credentials /etc/datool-logging/credentials.json
    export_to_project_id       YOUR_GCP_PROJECT_ID
    resource                   generic_node
    location                   YOUR_LOCATION
    namespace                  YOUR_NAMESPACE
    node_id                    YOUR_NODE_ID
    severity_key               severity
    labels_key                 logging.googleapis.com/labels
    log_name_key               logging.googleapis.com/logName
    labels                     service=datool
    compress                   gzip
    Retry_Limit                False
    storage.total_limit_size   256M
