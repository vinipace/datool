[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "datool"
version = "0.1.0"
description = "Python tracing, OpenTelemetry export, and managed prompts for Datool"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vinicius Pacheco" }]
dependencies = ["httpx>=0.27,<1", "opentelemetry-api>=1.33,<2", "opentelemetry-sdk>=1.33,<2"]

[project.optional-dependencies]
langchain = ["langchain-core>=1,<2"]

[project.urls]
Repository = "https://github.com/vinipace/datool/tree/main/packages/python-sdk"
Documentation = "https://github.com/vinipace/datool/blob/main/packages/python-sdk/README.md"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "mypy>=1.15,<2", "build>=1.2,<2", "twine>=6,<7", "langchain-core>=1,<2"]
langgraph = [
    "langgraph>=1,<2",
]
agents = [
    "langchain>=1,<2",
    "deepagents>=0.7.18,<0.8; python_version >= '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/datool"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/datool"]
check_untyped_defs = true
disallow_untyped_defs = true
