version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      payload:
        patterns:
          - payload
          - "@payloadcms/*"
      storybook:
        patterns:
          - storybook
          - "@storybook/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
