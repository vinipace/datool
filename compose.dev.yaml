# Development databases only; intentionally separate from the production stack.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datool
      POSTGRES_USER: datool
      POSTGRES_PASSWORD: datool
    ports:
      - "127.0.0.1:${DATOOL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - datool-dev-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${DATOOL_REDIS_PORT:-6379}:6379"
    volumes:
      - datool-dev-redis:/data
volumes:
  datool-dev-postgres:
  datool-dev-redis:
