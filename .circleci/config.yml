# CI runs without secrets. Release contexts must be restricted to main and this project.
# See docs/ci.md for activation, scheduled monitoring, and npm trusted publishing.
version: 2.1
orbs:
  node: circleci/node@7.2.1
parameters:
  operation:
    type: enum
    enum:
      - verify
      - regression
      - publish
      - publish-hermes
      - disk-health
    default: verify
  verify-image:
    type: boolean
    default: true
    description: Build and smoke-test the deployable image on branches too; only main can deploy.
  release-version:
    type: string
    default: ""
  release-package:
    type: enum
    enum:
      - sdk
      - cli
      - all
    default: sdk
executors:
  linux:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATOOL_TEST_DATABASE_URL: postgresql://postgres:package-fixture@127.0.0.1:5432/postgres
      DATOOL_TEST_REDIS_URL: redis://127.0.0.1:6379
      DATOOL_PROJECT_ID: package-fixture-project
      DATOOL_API_KEY: package-fixture-key
  ssh:
    docker:
      - image: cimg/base:2026.09
    resource_class: small
commands:
  install-github-release-client:
    steps:
      - run:
          name: Install verified GitHub CLI 2.101.0
          command: |
            curl --fail --silent --show-error --location --retry 3 https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz --output /tmp/hermes-gh.tar.gz
            echo '9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  /tmp/hermes-gh.tar.gz' | sha256sum --check -
            tar -xzf /tmp/hermes-gh.tar.gz -C /tmp
            sudo install -m 0755 /tmp/gh_2.101.0_linux_amd64/bin/gh /usr/local/bin/gh
            gh --version
  configure-restricted-ssh:
    parameters:
      key-variable:
        type: string
      hosts-variable:
        type: string
      key-file:
        type: string
      hosts-file:
        type: string
        default: known_hosts
    steps:
      - run:
          name: Restore and validate restricted SSH credentials
          environment:
            DATOOL_SSH_KEY_VARIABLE: << parameters.key-variable >>
            DATOOL_SSH_HOSTS_VARIABLE: << parameters.hosts-variable >>
            DATOOL_SSH_KEY_FILE: << parameters.key-file >>
            DATOOL_SSH_HOSTS_FILE: << parameters.hosts-file >>
          command: |
            set +x
            test -n "$DOKKU_SSH_HOST" || { echo "Configure DOKKU_SSH_HOST in the restricted CircleCI context" >&2; exit 1; }
            umask 077
            install -d -m 700 "$HOME/.ssh"
            key_path="$HOME/.ssh/$DATOOL_SSH_KEY_FILE"
            hosts_path="$HOME/.ssh/$DATOOL_SSH_HOSTS_FILE"
            # CircleCI's single-line secret input removes pasted line breaks.
            # Rewrap OpenSSH armor without changing its base64 payload.
            printenv "$DATOOL_SSH_KEY_VARIABLE" | awk '
              { gsub(/\r/, ""); key = key $0 }
              END {
                header = "-----BEGIN OPENSSH PRIVATE KEY-----"
                footer = "-----END OPENSSH PRIVATE KEY-----"
                if (index(key, header) != 1 || substr(key, length(key) - length(footer) + 1) != footer) {
                  print "Invalid OpenSSH private key format" > "/dev/stderr"
                  exit 1
                }
                key = substr(key, length(header) + 1, length(key) - length(header) - length(footer))
                gsub(/[[:space:]]/, "", key)
                if (key !~ /^[A-Za-z0-9+\/=]+$/) exit 1
                print header
                for (i = 1; i <= length(key); i += 64) print substr(key, i, 64)
                print footer
              }
            ' > "$key_path"
            chmod 600 "$key_path"
            ssh-keygen -y -P '' -f "$key_path" > /dev/null
            printenv "$DATOOL_SSH_HOSTS_VARIABLE" > "$hosts_path"
            test -s "$hosts_path"
            chmod 600 "$hosts_path"
  install-dependencies:
    steps:
      - node/install:
          node-version: 24.18.0
          install-yarn: false
      - run:
          name: Install Bun 1.3.14
          command: |-
            curl --fail --silent --show-error --location https://bun.com/install --output /tmp/install-bun.sh
            bash /tmp/install-bun.sh bun-v1.3.14
            printf 'export PATH="$HOME/.bun/bin:$PATH"\n' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - v1-bun-1.3.14-{{ arch }}-{{ checksum "bun.lock" }}
      - run:
          name: Install locked dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: v1-bun-1.3.14-{{ arch }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
  start-services:
    steps:
      - run:
          name: Start isolated PostgreSQL 18 and Redis 7
          command: |-
            docker run -d --name datool-ci-postgres -e POSTGRES_PASSWORD=package-fixture -p 127.0.0.1:5432:5432 pgvector/pgvector:pg18
            docker run -d --name datool-ci-redis -p 127.0.0.1:6379:6379 redis:7-alpine
            for attempt in $(seq 1 60); do
              if docker exec datool-ci-postgres pg_isready -U postgres && docker exec datool-ci-redis redis-cli ping | grep -q PONG; then
                exit 0
              fi
              sleep 2
            done
            docker logs datool-ci-postgres
            docker logs datool-ci-redis
            exit 1
  install-uv:
    steps:
      - run:
          name: Install uv 0.12.6
          command: |-
            curl --fail --silent --show-error --location https://astral.sh/uv/0.12.6/install.sh --output /tmp/install-uv.sh
            UV_UNMANAGED_INSTALL="$HOME/.local/bin" sh /tmp/install-uv.sh
            printf 'export PATH="$HOME/.local/bin:$PATH"\n' >> "$BASH_ENV"
jobs:
  hermes-verify:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      RELEASE_VERSION: << pipeline.parameters.release-version >>
      CI_OPERATION: << pipeline.parameters.operation >>
    steps:
      - checkout
      - install-github-release-client
      - run:
          name: Test Hermes delivery, packaging, and extracted installation
          command: python3 -m unittest discover -s tests/hermes -v
      - run:
          name: Build and checksum the source-only plugin
          command: |
            if [ "$CI_OPERATION" = publish-hermes ]; then
              test "$CIRCLE_BRANCH" = main
              test -n "$RELEASE_VERSION"
              python3 scripts/package-hermes-plugin.py --tag "hermes-v$RELEASE_VERSION" --output-dir dist/hermes
            else
              python3 scripts/package-hermes-plugin.py --output-dir dist/hermes
            fi
            (cd dist/hermes && sha256sum --check *.sha256)
            git rev-parse HEAD > dist/hermes/commit.txt
      - store_artifacts:
          path: dist/hermes
          destination: hermes-plugin
      - persist_to_workspace:
          root: .
          paths:
            - dist/hermes
  hermes-publish:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      RELEASE_VERSION: << pipeline.parameters.release-version >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-github-release-client
      - run:
          name: Publish and verify the tested Hermes ZIP
          command: bash scripts/publish-hermes-plugin.sh
  verify:
    executor: linux
    resource_class: large
    steps:
      - checkout
      - install-dependencies
      - start-services
      - run:
          name: Verify source and release contracts in parallel
          command: |
            logs="$(mktemp -d)"
            trap 'rm -rf "$logs"' EXIT
            (bun run lint && bun run check:styles) > "$logs/lint" 2>&1 &
            lint_pid=$!
            bun run typecheck > "$logs/types" 2>&1 &
            types_pid=$!
            (
              python3 -m unittest discover -s tests -p 'dokku_*_test.py'
              python3 -m unittest discover -s tests -p 'deployment_notifications_test.py'
              bun --no-env-file test --timeout 30000 \
                tests/release-command.test.ts tests/deployment-image-handoff.test.ts \
                tests/cms-seed-options.test.ts tests/circleci-ssh-key.test.ts \
                tests/organization-auth.test.ts tests/project-api-response.test.ts \
                tests/ingestion-http.test.ts tests/ingestion-sequence.test.ts \
                tests/execution-credits.test.ts tests/build-integrations.test.ts tests/build-shopify.test.ts \
                tests/build-feature-gate.test.ts tests/build-api.test.ts \
                tests/build-mcp.test.ts tests/build-organization-worker.test.ts
              bun run test:build:access
            ) > "$logs/critical" 2>&1 &
            critical_pid=$!
            status=0
            for check in lint types critical; do
              pid_variable="${check}_pid"
              if wait "${!pid_variable}"; then
                printf 'PASS %s\n' "$check"
              else
                printf 'FAIL %s\n' "$check"
                status=1
              fi
              cat "$logs/$check"
            done
            exit "$status"
  regression-backend:
    executor: linux
    resource_class: large
    steps:
      - checkout
      - install-dependencies
      - start-services
      - run:
          name: Prepare runtime assets, built SDK and CLI, and scorer images
          command: |
            bun run build:monaco
            bun run build:chatgpt
            bun run build:packages
            docker pull node:22-bookworm-slim
            docker pull python:3.13-slim
      - run:
          name: Run the complete Bun suite once
          command: bun --no-env-file test tests --timeout 30000
          environment:
            DATOOL_TEST_SANDBOX_CONTAINERS: "1"
      - run:
          name: Exercise managed prompts and durable evaluation recovery
          command: |
            bun run scripts/test-managed-prompts-e2e.ts
            bun --no-env-file scripts/test-evaluation-workflow-e2e.ts
  regression-browser:
    executor: linux
    resource_class: large
    steps:
      - checkout
      - install-dependencies
      - start-services
      - run:
          name: Verify agent authoring and WhatsApp through HTTP and browser boundaries
          command: |
            bunx playwright install --with-deps chromium
            bun run build:monaco
            bun run build:chatgpt
            bun --no-env-file scripts/test-build-e2e.ts --production
            bun --no-env-file scripts/test-widget-authoring-e2e.ts
            bun run test:whatsapp:e2e
      - store_artifacts:
          path: artifacts/build-e2e
          destination: build-browser-checks
      - store_artifacts:
          path: artifacts/widget-authoring-e2e
          destination: widget-authoring-checks
  regression-packages:
    executor: linux
    resource_class: large
    steps:
      - checkout
      - install-dependencies
      - start-services
      - run:
          name: Validate public skills and installer discovery
          command: |
            bun run check:skills
            repository="$PWD"
            cd "$(mktemp -d)"
            npx --yes skills@1.5.25 add "$repository" --list
          environment:
            DISABLE_TELEMETRY: "1"
      - run:
          name: Verify the minimum published CLI on Node 24 and Bun
          command: node scripts/test-cli-distribution.mjs 0.3.0
      - run:
          name: Build and pack SDK and CLI once
          command: bun run pack:packages
      - run:
          name: Verify packed packages on Node 24 and Bun
          command: |
            bun run scripts/test-packages.ts
            export DATOOL_TEST_CLI_BINARY="$PWD/packages/cli/dist/datool.js"
            for runtime in node bun; do
              DATOOL_TEST_CLI_RUNTIME="$runtime" bun test tests/cli-watch-relay.test.ts
            done
            node scripts/test-cli-distribution.mjs "artifacts/npm/datool-cli-$(node -p 'require("./packages/cli/package.json").version').tgz"
      - node/install:
          node-version: 22.18.0
          install-yarn: false
      - run:
          name: Verify the same packages on Node 22
          command: |
            bun run scripts/test-packages.ts
            DATOOL_TEST_CLI_BINARY="$PWD/packages/cli/dist/datool.js" DATOOL_TEST_CLI_RUNTIME=node bun test tests/cli-watch-relay.test.ts
            DATOOL_TEST_NODE_ONLY=1 node scripts/test-cli-distribution.mjs "artifacts/npm/datool-cli-$(node -p 'require("./packages/cli/package.json").version').tgz"
      - store_artifacts:
          path: artifacts/npm
          destination: npm-packages
  production-image:
    machine:
      image: ubuntu-2404:2026.05.1
      docker_layer_caching: true
    resource_class: large
    environment:
      CI: "true"
      CIRCLE_PIPELINE_NUMBER: << pipeline.number >>
      DATOOL_DOCKER_ARCHIVE_PATH: /tmp/datool-release-image.tar
    steps:
      - checkout
      - run:
          name: Set unique image reference
          command: printf 'export DATOOL_DOCKER_TEST_IMAGE="datool-release:%s-%s-%s"\n' "$CIRCLE_SHA1" "$CIRCLE_PIPELINE_NUMBER" "$CIRCLE_BUILD_NUM" >> "$BASH_ENV"
      - run:
          name: Test deployment access and disk import safety
          command: python3 -m unittest discover -s tests -p 'dokku_*_test.py'
      - run:
          name: Restore the named BuildKit builder
          command: |
            # A stable container builder keeps BuildKit state and cache mounts
            # in a named volume that CircleCI DLC preserves between jobs.
            docker buildx create --name datool-release --driver docker-container
      - run:
          name: Build the production image on the CI runner
          command: |
            # Build one archive and load that exact image for acceptance.
            docker buildx build --builder datool-release --progress plain \
              --output "type=docker,compression=gzip,compression-level=1,dest=$DATOOL_DOCKER_ARCHIVE_PATH" \
              --build-arg DATOOL_CI_BUILD=true \
              --label "org.opencontainers.image.revision=$CIRCLE_SHA1" \
              --tag "$DATOOL_DOCKER_TEST_IMAGE" .
      - run:
          name: Load the archive for image acceptance
          command: docker image load --input "$DATOOL_DOCKER_ARCHIVE_PATH"
      - run:
          name: Test release command, image handoff, and CMS seed guards
          command: |
            docker run --rm --network none --read-only --tmpfs /tmp:exec \
              --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
              --mount "type=bind,source=$PWD/.circleci,target=/app/.circleci,readonly" \
              --entrypoint bun "$DATOOL_DOCKER_TEST_IMAGE" test tests/release-command.test.ts tests/deployment-image-handoff.test.ts tests/cms-seed-options.test.ts
      - run:
          name: Exercise the production image with isolated services
          command: |
            # Acceptance runs containers without changing the built image, so
            # its archive can be prepared concurrently. Both must succeed.
            command -v pigz >/dev/null || sudo apt-get install -y pigz
            (
              pigz -1 < "$DATOOL_DOCKER_ARCHIVE_PATH" > image.tar.gz
            ) &
            archive_pid=$!
            status=0
            bash scripts/test-docker.sh || status=1
            wait "$archive_pid" || status=1
            exit "$status"
          environment:
            DATOOL_DOCKER_SKIP_BUILD: "1"
      - run:
          name: Checksum the verified image archive
          command: |
            printf '%s\n' "$DATOOL_DOCKER_TEST_IMAGE" > image-ref.txt
            docker image inspect "$DATOOL_DOCKER_TEST_IMAGE" --format '{{.Size}}' > image-size.txt
            sha256sum image.tar.gz image-ref.txt image-size.txt > image.sha256
            sha256sum ops/notify-deployment.py > notification.sha256
      - persist_to_workspace:
          root: .
          paths:
            - image.tar.gz
            - image-ref.txt
            - image-size.txt
            - image.sha256
            - ops/notify-deployment.py
            - notification.sha256
      - run:
          name: Retain only the latest accepted runtime image
          command: |
            # Keep shared installed layers for the next acceptance run without
            # accumulating another tagged runtime image for every commit.
            docker image ls 'datool-release:*' --format '{{.Repository}}:{{.Tag}}' |
              awk -v current="$DATOOL_DOCKER_TEST_IMAGE" '$0 != current' |
              xargs --no-run-if-empty docker image rm ||
              echo "Some cached runtime images are still in use; retaining them."
      - run:
          name: Bound the BuildKit cache before saving DLC
          command: |
            # DLC discards the entire snapshot when it grows too large.
            # Leave room for the accepted runtime image and service images.
            # Remove download mounts retained from older Dockerfile versions.
            docker buildx prune --builder datool-release --force \
              --filter 'type=exec.cachemount' \
              --filter 'description~="/root/[.]bun/install/cache"'
            docker buildx prune --builder datool-release --force --max-used-space 9gb
            docker buildx du --builder datool-release
  deploy:
    executor: ssh
    environment:
      CIRCLE_PIPELINE_NUMBER: << pipeline.number >>
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Verify the image archive
          command: sha256sum --check image.sha256
      - run:
          name: Verify the notification script
          command: sha256sum --check notification.sha256
      - run:
          name: Announce deployment in Slack
          environment:
            DEPLOYMENT_STATUS: started
          command: &notify_datool_deployment |
            python3 ops/notify-deployment.py "$DEPLOYMENT_STATUS" \
              --app Datool --environment production \
              --deployment-id "$CIRCLE_WORKFLOW_ID-$CIRCLE_BUILD_NUM" --commit "$CIRCLE_SHA1" \
              --url "$CIRCLE_BUILD_URL" --state-file /tmp/datool-deployment-slack.json || true
      - configure-restricted-ssh:
          key-variable: DOKKU_NETCUP_SSH_PRIVATE_KEY
          hosts-variable: DOKKU_NETCUP_SSH_KNOWN_HOSTS
          key-file: datool_deploy
      - run:
          name: Import and release the verified image through Dokku
          command: |
            test "$CIRCLE_BRANCH" = main
            read -r image < image-ref.txt
            read -r image_bytes < image-size.txt
            if ! [[ "$image" =~ ^datool-release:${CIRCLE_SHA1}-${CIRCLE_PIPELINE_NUMBER}-[0-9]+$ ]]; then
              echo "Image reference does not belong to this workflow commit and run" >&2
              exit 1
            fi
            if ! [[ "$image_bytes" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid image size" >&2
              exit 1
            fi
            ssh -i ~/.ssh/datool_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "datool-deploy@$DOKKU_SSH_HOST" disk:load-image datool "$image" "$image_bytes" < image.tar.gz
      - run:
          name: Verify web, ingestion, and Build processes
          command: |
            ssh -i ~/.ssh/datool_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "datool-deploy@$DOKKU_SSH_HOST" ps:report datool > process-report.txt
            cat process-report.txt
            grep -Eq 'Status web 1:[[:space:]]+running' process-report.txt
            grep -Eq 'Status worker 1:[[:space:]]+running' process-report.txt
            grep -Eq 'Status buildworker 1:[[:space:]]+running' process-report.txt
            test "$(ssh -i ~/.ssh/datool_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "datool-deploy@$DOKKU_SSH_HOST" ps:report datool --running)" = true
      - run:
          name: Verify public endpoint
          command: |
            test -n "$DATOOL_URL"
            for path in / /faq /faq.md /cms/api/cms-users/me /sign-in /docs /llms.txt; do
              curl --fail --silent --show-error --location --proto-redir '=https' --connect-timeout 10 --max-time 30 \
                --retry 6 --retry-all-errors --retry-delay 5 "$DATOOL_URL$path" --output /dev/null
            done
      - run:
          name: Remove deployment key
          command: rm -f ~/.ssh/datool_deploy
          when: always
      - run:
          name: Reply with deployment success
          environment:
            DEPLOYMENT_STATUS: succeeded
          command: *notify_datool_deployment
      - run:
          name: Reply with deployment failure
          when: on_fail
          environment:
            DEPLOYMENT_STATUS: failed
          command: *notify_datool_deployment
  publish:
    executor: linux
    environment:
      RELEASE_VERSION: << pipeline.parameters.release-version >>
      RELEASE_PACKAGE: << pipeline.parameters.release-package >>
    steps:
      - checkout
      - install-dependencies
      - start-services
      - run:
          name: Require main and an explicit version
          command: |-
            test "$CIRCLE_BRANCH" = main
            test -n "$RELEASE_VERSION"
      - run:
          name: npm install --global npm@11.16.0
          command: npm install --global npm@11.16.0
      - run:
          name: Verify release metadata
          command: bun run check:release "$RELEASE_VERSION" "$RELEASE_PACKAGE"
          environment:
            RELEASE_VERSION: << pipeline.parameters.release-version >>
            RELEASE_PACKAGE: << pipeline.parameters.release-package >>
      - run:
          name: bun run pack:packages
          command: bun run pack:packages
      - run:
          name: bun run test:packages
          command: bun run test:packages
      - run:
          name: Verify relay reload races and source watching
          command: bun test tests/relay-reload.test.ts tests/connect-source-watch.test.ts tests/app-relay.test.ts
      - run:
          name: Verify the built watched CLI with the real relay under Node and Bun
          command: |
            export DATOOL_TEST_CLI_BINARY="$PWD/packages/cli/dist/datool.js"
            for runtime in node bun; do
              DATOOL_TEST_CLI_RUNTIME="$runtime" bun test tests/cli-watch-relay.test.ts
            done
      - run:
          name: Test the CLI tarball in clean Node and Bun consumers
          command: |-
            if [ "$RELEASE_PACKAGE" = cli ] || [ "$RELEASE_PACKAGE" = all ]; then
              node scripts/test-cli-distribution.mjs "artifacts/npm/datool-cli-$RELEASE_VERSION.tgz"
            fi
          environment:
            RELEASE_VERSION: << pipeline.parameters.release-version >>
      - run:
          name: bun test tests/pricing-catalog.test.ts tests/cost-backfill.test.ts tests/cost-backfill-postgres.test.ts tests/tracer-usage.test.ts tests/tracer-sdk.test.ts tests/tracer-instrumentation.test.ts tests/tracer-otel.test.ts tests/call-context.test.ts tests/app-connections.test.ts
          command: bun test tests/pricing-catalog.test.ts tests/cost-backfill.test.ts tests/cost-backfill-postgres.test.ts tests/tracer-usage.test.ts tests/tracer-sdk.test.ts tests/tracer-instrumentation.test.ts tests/tracer-otel.test.ts tests/call-context.test.ts tests/app-connections.test.ts
      - store_artifacts:
          path: artifacts/npm
          destination: npm-release
      - run:
          name: Publish the tested tarballs with npm trusted publishing
          command: |
            set +x
            NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            export NPM_ID_TOKEN
            if [ "$RELEASE_PACKAGE" = sdk ] || [ "$RELEASE_PACKAGE" = all ]; then
              npm publish "artifacts/npm/datool-sdk-$RELEASE_VERSION.tgz" --ignore-scripts --access public
            fi
            if [ "$RELEASE_PACKAGE" = cli ] || [ "$RELEASE_PACKAGE" = all ]; then
              npm publish "artifacts/npm/datool-cli-$RELEASE_VERSION.tgz" --ignore-scripts --access public
            fi
          environment:
            RELEASE_VERSION: << pipeline.parameters.release-version >>
            RELEASE_PACKAGE: << pipeline.parameters.release-package >>
      - run:
          name: Verify the actual npm CLI release
          command: |-
            if [ "$RELEASE_PACKAGE" = cli ] || [ "$RELEASE_PACKAGE" = all ]; then
              node scripts/test-cli-distribution.mjs "$RELEASE_VERSION"
            fi
          environment:
            RELEASE_VERSION: << pipeline.parameters.release-version >>
  disk-health:
    executor: ssh
    steps:
      - configure-restricted-ssh:
          key-variable: NETCUP_MONITOR_SSH_PRIVATE_KEY
          hosts-variable: NETCUP_MONITOR_SSH_KNOWN_HOSTS
          key-file: netcup_monitor
          hosts-file: netcup_known_hosts
      - run:
          name: Check Netcup disk headroom
          command: |
            ssh -i ~/.ssh/netcup_monitor -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/netcup_known_hosts \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "datool-monitor@$DOKKU_SSH_HOST" disk:status datool
      - run:
          name: Remove monitoring key
          command: rm -f ~/.ssh/netcup_monitor ~/.ssh/netcup_known_hosts
          when: always
  python-verify:
    executor: linux
    environment:
      CI_TRIGGER_SOURCE: << pipeline.trigger_source >>
    steps:
      - checkout
      - install-dependencies
      - install-uv
      - run:
          name: Verify Python SDK wheel, runtimes, and real ingestion
          command: bash scripts/ci-python-sdk.sh
      - store_artifacts:
          path: packages/python-sdk/dist
          destination: python-sdk
workflows:
  ci:
    when:
      equal:
        - verify
        - << pipeline.parameters.operation >>
    jobs:
      - verify
      - python-verify
      - hermes-verify
      - production-image:
          filters: pipeline.git.branch == "main" or pipeline.parameters.verify-image
      - deploy:
          requires:
            - verify
            - production-image
          context: datool-production
          serial-group: << pipeline.project.slug >>/production
          filters:
            branches:
              only: main
  regression:
    when:
      equal:
        - regression
        - << pipeline.parameters.operation >>
    jobs:
      - verify
      - regression-backend
      - regression-browser
      - regression-packages
      - python-verify
      - hermes-verify
  nightly-regression:
    triggers:
      - schedule:
          cron: 32 6 * * *
          filters:
            branches:
              only: main
    jobs:
      - regression-backend
      - regression-browser
      - regression-packages
      - python-verify
      - hermes-verify
  publish-hermes:
    when:
      equal:
        - publish-hermes
        - << pipeline.parameters.operation >>
    jobs:
      - hermes-verify:
          filters:
            branches:
              only: main
      - hermes-publish:
          requires:
            - hermes-verify
          context: datool-hermes
          serial-group: << pipeline.project.slug >>/hermes
          filters:
            branches:
              only: main
  publish-packages:
    when:
      equal:
        - publish
        - << pipeline.parameters.operation >>
    jobs:
      - publish:
          context: datool-npm
          serial-group: << pipeline.project.slug >>/npm
          filters:
            branches:
              only: main
  disk-health:
    when:
      equal:
        - disk-health
        - << pipeline.parameters.operation >>
    jobs:
      - disk-health:
          context: datool-monitor
          filters:
            branches:
              only: main
  scheduled-disk-health:
    triggers:
      - schedule:
          cron: 17 0,6,12,18 * * *
          filters:
            branches:
              only: main
    jobs:
      - disk-health:
          context: datool-monitor
